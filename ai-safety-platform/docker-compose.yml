version: "3.9"

services:
  mongodb:
    image: mongo:7
    container_name: ai-safety-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: ai-safety-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ai-safety-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - mongodb
      - redis
    ports:
      - "8000:8000"

  celery-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ai-safety-celery-worker
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - backend
      - redis
      - mongodb
    command: celery -A backend.workers.tasks worker --loglevel=info

  frontend:
    image: node:20-alpine
    container_name: ai-safety-frontend
    restart: unless-stopped
    working_dir: /app/frontend
    volumes:
      - ./:/app
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
      - NODE_ENV=development
    depends_on:
      - backend
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"

volumes:
  mongo_data:
